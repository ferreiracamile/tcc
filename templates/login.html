<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Almoxarifado SENAI</title>
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../static/scripts.js"></script>
</head>
<body>

<div style="width: 350px; margin: 80px auto;" class="box">
    <h1 style="color: #0054A6; text-align: center; margin-bottom: 5px;">SENAI</h1>
    <h3 style="text-align: center; color: #555; margin-top: 0;">Sistema de Almoxarifado</h3>
    <hr>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mensagem {{ 'sucesso' if category == 'success' else 'erro' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% if erro %}
        <div class="mensagem erro">{{ erro }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <label>Usuário:</label>
        <input type="text" name="usuario" placeholder="Digite seu usuário" required>

        <label>Senha:</label>
        <input type="password" name="senha" placeholder="Digite sua senha" required>

        <button type="submit" class="btn btn-laranja" style="width: 100%; margin-top: 20px;">ENTRAR</button>
    </form>
</div>
</body>
</html>
