<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Almoxarifado SENAI</title>
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../static/scripts.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fundo com foto de almoxarifado e película escura para contraste */
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=1600') no-repeat center center / cover;
            font-family: Arial, sans-serif;
        }
        .box {
            width: 350px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .box input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="box">
    <h1 style="color: #0054A6; text-align: center; margin-bottom: 5px;">SENAI</h1>
    <h3 style="text-align: center; color: #555; margin-top: 0;">Sistema de Almoxarifado</h3>
    <hr style="margin-bottom: 15px;">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mensagem {{ 'sucesso' if category == 'success' else 'erro' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% if erro %}
        <div class="mensagem erro">{{ erro }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <label>Usuário:</label>
        <input type="text" name="usuario" placeholder="Digite seu usuário" required>

        <label>Senha:</label>
        <input type="password" name="senha" placeholder="Digite sua senha" required>

        <button type="submit" class="btn btn-laranja" style="width: 100%; margin-top: 10px; padding: 10px; cursor: pointer;">ENTRAR</button>
    </form>
</div>

</body>
</html>
