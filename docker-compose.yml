services:
  db:
    image: mysql:8.0
    container_name: almoxarifado_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: almoxarifado
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./bancodados.sql:/docker-entrypoint-initdb.d/init.sql:ro

  web:
    build: .
    container_name: almoxarifado_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=almoxarifado
      - DB_PORT=3306
    depends_on:
      - db

volumes:
  db_data:
